version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: idempotency-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - idempotency-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  idempotency-network:
    driver: bridge