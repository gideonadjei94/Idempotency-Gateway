spring:
  application:
    name: finsafe


  data:
    redis:
      host: localhost
      port: 6379
      password: your-strong-password-here
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
        shutdown-timeout: 100ms


server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always


logging:
  level:
    root: INFO
    com.finsafe.idempotency: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"


idempotency:
  key-ttl: 3600
  processing-delay: 2000
  max-payload-size: 10240